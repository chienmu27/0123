<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>社團安全點名系統</title>

  <style>
    :root{
      --pink-1:#ffe4ef;
      --pink-2:#ffd1e6;
      --pink-3:#ffb8d8;
      --rose:#ff6fa8;

      --mint-1:#e9fff6;
      --mint-2:#c9f5e5;
      --mint:#3bbf9a;

      --lav:#f3e9ff;
      --cream:#fff9f2;

      --text:#3b2f3a;
      --muted:#7a6676;

      --card: rgba(255,255,255,0.78);
      --stroke: rgba(255, 160, 200, 0.35);
      --shadow: 0 12px 35px rgba(255, 120, 170, 0.15);
    }

    *{ box-sizing: border-box; }

    body{
      font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      padding: 20px;
      color: var(--text);
      min-height: 100vh;

      /* 春季粉嫩背景：漸層＋淡淡花瓣感 */
      background:
        radial-gradient(circle at 12% 18%, rgba(255, 195, 220, 0.45), transparent 55%),
        radial-gradient(circle at 80% 15%, rgba(205, 245, 230, 0.45), transparent 55%),
        radial-gradient(circle at 20% 85%, rgba(243, 233, 255, 0.55), transparent 60%),
        radial-gradient(circle at 90% 85%, rgba(255, 249, 242, 0.9), transparent 55%),
        linear-gradient(135deg, #fff6fb 0%, #f7fff9 45%, #fffaf3 100%);
    }

    .container{
      max-width: 520px;
      margin: auto;
      padding: 26px 22px;
      border-radius: 20px;

      background: var(--card);
      border: 1px solid rgba(255,255,255,0.6);
      box-shadow: var(--shadow);

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      position: relative;
      overflow: hidden;
    }

    /* 卡片上方淡淡花朵光暈 */
    .container::before{
      content:"";
      position:absolute;
      inset:-120px -120px auto auto;
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, rgba(255, 182, 215, 0.55), transparent 60%);
      filter: blur(6px);
      pointer-events:none;
    }

    .container::after{
      content:"";
      position:absolute;
      inset:auto auto -140px -140px;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(190, 245, 230, 0.55), transparent 60%);
      filter: blur(6px);
      pointer-events:none;
    }

    h2{
      text-align:center;
      margin: 6px 0 18px 0;
      font-size: 26px;
      letter-spacing: 1px;
      color: #a23b6f;
      text-shadow: 0 2px 0 rgba(255,255,255,0.6);
    }

    p{
      color: var(--muted);
    }

    .btn-group{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
    }

    button{
      padding: 12px 14px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .2s ease, filter .2s ease;
      font-weight: 700;
      letter-spacing: .5px;
      user-select: none;
    }

    button:active{
      transform: translateY(1px) scale(0.99);
    }

    /* 社團按鈕：粉嫩花朵漸層 */
    .club-btn{
      background: linear-gradient(135deg, #ffe1ef 0%, #fff 55%, #e8fff7 100%);
      color: #8d2f5e;
      border: 1px solid rgba(255, 140, 190, 0.35);
      box-shadow: 0 10px 18px rgba(255, 120, 170, 0.12);
    }

    .club-btn:hover{
      transform: translateY(-1px);
      box-shadow: 0 14px 24px rgba(255, 120, 170, 0.18);
      filter: brightness(1.02);
    }

    /* 返回按鈕：溫柔灰粉 */
    .back-btn{
      background: linear-gradient(135deg, #fff 0%, #fff0f7 60%, #f3f3f3 100%);
      color: #6b5a66;
      border: 1px solid rgba(160, 150, 160, 0.25);
      box-shadow: 0 10px 18px rgba(0,0,0,0.06);
      margin-bottom: 14px;
    }

    .back-btn:hover{
      transform: translateY(-1px);
    }

    h3{
      margin: 6px 0 14px 0;
      font-size: 18px;
      color: #7b2d56;
    }

    .section{
      background: rgba(255, 255, 255, 0.72);
      padding: 16px 14px;
      border-radius: 16px;
      margin-bottom: 14px;
      border: 1px solid var(--stroke);
      box-shadow: 0 10px 18px rgba(255, 140, 190, 0.08);
    }

    .section label{
      font-weight: 800;
      color: #6f2a4e;
    }

    input[type="date"], input[type="password"]{
      width: 100%;
      padding: 12px 12px;
      margin-top: 10px;
      border-radius: 14px;
      border: 1px solid rgba(255, 140, 190, 0.35);
      font-size: 16px;
      outline: none;
      background: rgba(255,255,255,0.85);
      color: var(--text);
      transition: box-shadow .2s ease, border-color .2s ease;
    }

    input[type="date"]:focus, input[type="password"]:focus{
      border-color: rgba(255, 110, 170, 0.55);
      box-shadow: 0 0 0 4px rgba(255, 140, 190, 0.18);
    }

    #listStatus{
      color: var(--muted);
      font-size: 14px;
      margin-top: 10px;
    }

    .student-item{
      display:flex;
      align-items:center;
      padding: 12px 10px;
      border-bottom: 1px dashed rgba(255, 160, 200, 0.35);
    }

    .student-item:last-child{
      border-bottom: none;
    }

    /* checkbox 變可愛一點 */
    .student-item input[type="checkbox"]{
      width: 18px;
      height: 18px;
      accent-color: #ff6fa8;
      cursor: pointer;
    }

    .student-item label{
      margin-left: 12px;
      flex-grow:1;
      cursor:pointer;
      font-weight: 650;
      color: #4b2f3f;
    }

    /* 送出按鈕：春季薄荷綠漸層 */
    .submit-btn{
      width: 100%;
      font-size: 18px;
      margin-top: 14px;
      padding: 14px 16px;

      background: linear-gradient(135deg, #d8fff0 0%, #bff3e1 45%, #ffd2e7 100%);
      color: #2c6b5b;

      border: 1px solid rgba(60, 190, 155, 0.35);
      box-shadow: 0 14px 28px rgba(60, 190, 155, 0.14);
    }

    .submit-btn:hover{
      transform: translateY(-1px);
      box-shadow: 0 18px 34px rgba(60, 190, 155, 0.18);
      filter: brightness(1.02);
    }

    .submit-btn:disabled{
      cursor:not-allowed;
      opacity: 0.55;
      transform: none;
      box-shadow: none;
      background: linear-gradient(135deg, #f0f0f0, #fafafa);
      color: #888;
      border: 1px solid rgba(0,0,0,0.08);
    }

    #status{
      text-align:center;
      margin-top: 14px;
      font-weight: 900;
      letter-spacing: .5px;
    }

    .hidden{ display:none; }

    /* 小螢幕友善 */
    @media (max-width: 420px){
      .btn-group{ grid-template-columns: 1fr; }
      .container{ padding: 22px 16px; }
    }
  </style>
</head>

<body>

<div class="container">
  <h2 id="mainTitle">社團點名系統</h2>

  <div id="clubSelection">
    <p style="text-align:center; font-weight:700;">請選擇社團：</p>
    <div id="clubButtons" class="btn-group">讀取中...</div>
  </div>

  <div id="attendancePage" class="hidden">
    <button class="back-btn" onclick="backToClubs()">← 返回</button>
    <h3 id="selectedClubName"></h3>

    <div class="section">
      <label>1. 選擇上課日期：</label><br>
      <input type="date" id="attendanceDate">
    </div>

    <div id="studentListContainer" class="section">
      <label>2. 勾選出席學生：</label>
      <div id="listStatus">請載入名單...</div>
      <div id="studentList"></div>
    </div>

    <div class="section">
      <label>3. 管理員認證：</label><br>
      <input type="password" id="clubPassword" placeholder="請輸入該社團密碼">
    </div>

    <button id="submitBtn" class="submit-btn" onclick="submit()" disabled>確認送出點名</button>
    <div id="status"></div>
  </div>
</div>

<script>
  // ⚠️ 請填入你的 GAS 網頁應用程式 URL
  const API_URL = "https://script.google.com/macros/s/AKfycbxj7FwSWLIjAevblEoLnlcKBqxTdXECxUpqkW5UBKNkH5XFUs4wyAg1Nnjze_CguKR1/exec";

  let currentClub = "";

  window.onload = () => {
    fetchClubs();
    document.getElementById('attendanceDate').value = new Date().toISOString().split('T')[0];
    document.getElementById('attendanceDate').addEventListener('change', loadStudents);
  };

  async function fetchClubs() {
    try {
      const resp = await fetch(`${API_URL}?action=getClubList`);
      const clubs = await resp.json();
      const container = document.getElementById('clubButtons');
      container.innerHTML = "";
      clubs.forEach(club => {
        let btn = document.createElement('button');
        btn.className = "club-btn";
        btn.innerText = club;
        btn.onclick = () => selectClub(club);
        container.appendChild(btn);
      });
    } catch (e) { console.error(e); }
  }

  function selectClub(club) {
    currentClub = club;
    document.getElementById('clubSelection').classList.add('hidden');
    document.getElementById('attendancePage').classList.remove('hidden');
    document.getElementById('selectedClubName').innerText = "點名社團：" + club;
    document.getElementById('clubPassword').value = ""; // 清空上次密碼
    loadStudents();
  }

  function backToClubs() {
    document.getElementById('clubSelection').classList.remove('hidden');
    document.getElementById('attendancePage').classList.add('hidden');
  }

  async function loadStudents() {
    const date = document.getElementById('attendanceDate').value;
    const listDiv = document.getElementById('studentList');
    const statusDiv = document.getElementById('listStatus');

    listDiv.innerHTML = "";
    statusDiv.innerText = "載入名單中...";
    document.getElementById('submitBtn').disabled = true;

    try {
      const resp = await fetch(`${API_URL}?action=getStudents&clubName=${encodeURIComponent(currentClub)}&date=${date}`);
      const students = await resp.json();

      if (students.length === 0) {
        statusDiv.innerText = "此日期已無可點名學生。";
      } else {
        statusDiv.innerText = "";
        students.forEach(name => {
          let div = document.createElement('div');
          div.className = "student-item";
          div.innerHTML = `<input type="checkbox" id="chk_${name}" value="${name}"><label for="chk_${name}">${name}</label>`;
          listDiv.appendChild(div);
        });
        document.getElementById('submitBtn').disabled = false;
      }
    } catch (e) {
      statusDiv.innerText = "讀取失敗。";
    }
  }

  async function submit() {
    const date = document.getElementById('attendanceDate').value;
    const password = document.getElementById('clubPassword').value;
    const checkboxes = document.querySelectorAll('#studentList input[type="checkbox"]:checked');
    const selectedStudents = Array.from(checkboxes).map(cb => cb.value);

    if (selectedStudents.length === 0) return alert("請至少勾選一位學生");
    if (!password) return alert("請輸入點名密碼");

    const statusObj = document.getElementById('status');
    statusObj.innerText = "驗證中...";
    statusObj.style.color = "#a23b6f";
    document.getElementById('submitBtn').disabled = true;

    try {
      const resp = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({
          clubName: currentClub,
          date: date,
          students: selectedStudents,
          password: password
        })
      });
      const result = await resp.json();

      if (result.status === "success") {
        statusObj.innerText = result.message;
        statusObj.style.color = "#1a8f6d";
        document.getElementById('clubPassword').value = ""; // 成功後清空密碼
        setTimeout(() => {
          statusObj.innerText = "";
          loadStudents();
        }, 1500);
      } else {
        statusObj.innerText = result.message;
        statusObj.style.color = "#d23b6a";
        document.getElementById('submitBtn').disabled = false;
      }
    } catch (e) {
      statusObj.innerText = "連線失敗。";
      statusObj.style.color = "#d23b6a";
      document.getElementById('submitBtn').disabled = false;
    }
  }
</script>

</body>
</html>
