<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>訂單查詢系統</title>
    <style>
        :root { --primary: #4285f4; --bg: #f8f9fa; --card: #fff; --text: #333; }
        body { font-family: "Microsoft JhengHei", sans-serif; background: var(--bg); padding: 15px; color: var(--text); margin: 0; }
        .container { max-width: 450px; margin: 40px auto; }
        .search-box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center; }
        h3 { margin-top: 0; color: var(--primary); font-size: 1.5rem; margin-bottom: 10px;}
        input[type="text"] { width: 100%; box-sizing: border-box; padding: 12px; margin: 15px 0; border: 2px solid #eee; border-radius: 8px; font-size: 18px; text-align: center; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--primary); }
        button { background: var(--primary); color: white; border: none; padding: 12px 0; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; transition: 0.3s; }
        button:hover { background: #3367d6; box-shadow: 0 4px 10px rgba(66,133,244,0.3); }
        #resultArea { display: none; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); overflow: hidden; margin-top: 20px; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .data-row { display: flex; border-bottom: 1px solid #f0f0f0; padding: 15px; align-items: center; justify-content: space-between; }
        .data-row:last-child { border-bottom: none; }
        .data-label { color: #555; font-weight: bold; font-size: 14px; flex-shrink: 0; }
        .data-value { color: #222; font-size: 15px; word-break: break-all; text-align: right; margin-left: 10px; }
        #loading { display: none; margin-top: 15px; color: #666; font-size: 14px; }
        .spinner { display: inline-block; width: 18px; height: 18px; border: 3px solid #f3f3f3; border-top: 3px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; vertical-align: middle; margin-right: 8px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        /* 針對手機優化 */
        @media (max-width: 480px) {
            .container { margin: 10px auto; }
            .search-box { padding: 20px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="search-box">
        <h3>🔍 訂單進度查詢</h3>
        <p style="font-size:14px; color:#888; margin: 0;">請輸入「匯款帳號後五碼」進行查詢</p>
        
        <input type="text" id="verifyCode" placeholder="請輸入 5 位數字" maxlength="5" pattern="\d*" inputmode="numeric">
        
        <button id="submitBtn">送出查詢</button>
        
        <div id="loading">
            <div class="spinner"></div> 正在連線資料庫...
        </div>
    </div>

    <div id="resultArea"></div>
</div>

<script>
    // ▼▼▼ 請在此處填入你部署後的 GAS 網址 ▼▼▼
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw0iizobr8b5fQrPR5DXtDwyBxlfhrut_iLBloSIfEDTOZGf0zUyCmQ4vZDF-vJZLP1/exec"; 

    const btn = document.getElementById('submitBtn');
    const input = document.getElementById('verifyCode');

    // 支援按 Enter 送出
    input.addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            event.preventDefault();
            btn.click();
        }
    });

    btn.addEventListener('click', async () => {
        const code = input.value.trim();
        const resultArea = document.getElementById('resultArea');
        const loading = document.getElementById('loading');
        
        if (code.length < 5) { alert("請輸入完整的 5 位數字"); return; }
        
        // 重置介面
        resultArea.style.display = 'none';
        resultArea.innerHTML = '';
        loading.style.display = 'block';
        btn.disabled = true; // 防止重複點擊

        try {
            // 使用 GET 方法並將參數帶在 URL 後面
            // 注意：這裡使用 text/plain 是為了繞過 Google 的一些預檢請求，但主要是靠後端 JSONP 或直接回傳 JSON
            const targetUrl = `${SCRIPT_URL}?code=${encodeURIComponent(code)}`;
            
            const response = await fetch(targetUrl);
            
            // Google Apps Script 的 redirect 有時會導致 ok 為 false，但實際上有資料
            // 不過使用 GET + createTextOutput 通常是穩定的
            
            if (!response.ok) throw new Error("網路回應異常");
            
            const res = await response.json();

            if (res.status === 'success') {
                renderResult(res.data);
                resultArea.style.display = 'block';
                input.value = ''; // 查詢成功後清空
            } else {
                alert(res.message);
            }
        } catch (err) {
            console.error(err);
            alert("查詢失敗：請檢查網路連線，或確認 GAS 網址是否正確且權限已設為「所有人」。");
        } finally {
            loading.style.display = 'none';
            btn.disabled = false;
        }
    });

    function renderResult(data) {
        const container = document.getElementById('resultArea');
        container.innerHTML = data.map(item => `
            <div class="data-row">
                <div class="data-label">${item.label}</div>
                <div class="data-value">${(item.value !== "" && item.value !== null) ? item.value : "-"}</div>
            </div>
        `).join('');
    }
</script>

</body>
</html>
